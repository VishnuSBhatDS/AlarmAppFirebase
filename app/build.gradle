// app/build.gradle (module-level, Groovy DSL)

apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    namespace "com.example.criticalalerts"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.example.criticalalerts"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    // Kotlin DSL or other blocks can go here if needed
}

dependencies {
    // explicit coordinates to avoid relying on version-catalog 'libs' here
    implementation "com.google.firebase:firebase-messaging:24.0.0"

    // If you later want to use support libs or androidx libs, add them here:
    implementation "androidx.core:core-ktx:1.10.1"
    implementation("com.google.android.material:material:1.12.0")
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
}
